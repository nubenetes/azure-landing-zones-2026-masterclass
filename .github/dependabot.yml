# Keeps SHA-pinned GitHub Actions and Terraform providers/modules current.
# Generated with Claude Opus 5.5 - untested reference.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /code/day-0-bootstrap-oidc
      - /code/day-1-platform-landing-zone
      - /code/day-2-workload-vending-operations
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # The ALZ Azure Verified Modules require AzureRM ~> 4.x; v5 is not
      # supported yet (docs/02). Remove once the ALZ module index allows v5.
      - dependency-name: "hashicorp/azurerm"
        update-types: ["version-update:semver-major"]
