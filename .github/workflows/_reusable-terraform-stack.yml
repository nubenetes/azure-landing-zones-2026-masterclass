# -----------------------------------------------------------------------------
# Reusable workflow: plan (and optionally apply) ONE Terraform stack via OIDC.
#
# Generated with Claude Opus 5.5 - architectural reference, NOT tested in a
# live environment. Validate in a sandbox repository/tenant first.
#
# Identity model (Workload Identity Federation, zero static secrets):
#   plan  job -> AZURE_PLAN_CLIENT_ID  (repo variable)  read-only, -lock=false
#                OIDC subject: pull_request | ref:refs/heads/main
#   apply job -> AZURE_APPLY_CLIENT_ID (environment variable of the protected
#                environment) OIDC subject: environment:<name>
#                => cannot run without the environment's required reviewers.
#
# Actions are pinned to full commit SHAs (tag in trailing comment); Dependabot
# keeps them current (.github/dependabot.yml).
# -----------------------------------------------------------------------------
name: _reusable-terraform-stack

on:
  workflow_call:
    inputs:
      stack_path:
        description: Path of the Terraform root module, e.g. code/day-1-platform-landing-zone
        type: string
        required: true
      state_container:
        description: Blob container that holds this stack's state
        type: string
        required: true
      state_key:
        description: State blob name
        type: string
        required: true
      apply:
        description: Apply the reviewed plan after environment approval
        type: boolean
        default: false
      environment:
        description: Protected GitHub Environment for the apply job
        type: string
        default: production
      post_pr_comment:
        description: Post the plan summary on the pull request
        type: boolean
        default: false
    outputs:
      has_changes:
        description: "'true' when the plan contains changes (drift or pending work)"
        value: ${{ jobs.plan.outputs.has_changes }}
      plan_summary:
        description: One-line plan summary
        value: ${{ jobs.plan.outputs.plan_summary }}

env:
  TF_VERSION: "1.16.6"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  plan:
    name: plan (${{ inputs.stack_path }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    outputs:
      has_changes: ${{ steps.plan.outputs.has_changes }}
      plan_summary: ${{ steps.plan.outputs.summary }}
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_PLAN_CLIENT_ID }}
    defaults:
      run:
        working-directory: ${{ inputs.stack_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure login (OIDC, read-only identity)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_PLAN_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ inputs.state_container }}" \
            -backend-config="key=${{ inputs.state_key }}" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform plan
        id: plan
        # -lock=false: the plan identity has read-only access to state by design.
        # Staleness is caught at apply time: a saved plan is rejected if the
        # state serial changed since it was created.
        run: |
          set +e
          terraform plan -lock=false -out=tfplan -detailed-exitcode
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "::error::terraform plan failed"
            exit 1
          fi
          terraform show -no-color tfplan > plan.txt
          summary=$(grep -E '^(Plan:|No changes\.)' plan.txt | tail -n 1 || true)
          echo "summary=${summary:-unknown}" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 2 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### ${{ inputs.stack_path }}"
            echo ""
            echo "**${summary:-unknown}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plan artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ inputs.state_key }}
          overwrite: true
          path: |
            ${{ inputs.stack_path }}/tfplan
            ${{ inputs.stack_path }}/plan.txt
          retention-days: 5
          if-no-files-found: error

      - name: Comment plan on pull request
        if: inputs.post_pr_comment && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          STACK: ${{ inputs.stack_path }}
          SUMMARY: ${{ steps.plan.outputs.summary }}
        with:
          script: |
            const fs = require('fs');
            const stack = process.env.STACK;
            const marker = `<!-- tf-plan:${stack} -->`;
            let plan = fs.readFileSync(`${stack}/plan.txt`, 'utf8');
            const max = 60000;
            if (plan.length > max) {
              plan = plan.substring(plan.length - max);
              plan = '... (truncated, full plan in the workflow artifact)\n' + plan;
            }
            const body = [
              marker,
              `### Terraform plan - \`${stack}\``,
              `**${process.env.SUMMARY}**`,
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              plan,
              '```',
              '</details>',
              '',
              '> Generated with Claude Opus 5.5 reference pipeline - review every change; this repository has not been tested in a live environment.'
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  apply:
    name: apply (${{ inputs.stack_path }})
    needs: plan
    if: inputs.apply && needs.plan.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Environment protection rules (required reviewers, main-only deployment
    # branch policy, optional wait timer) gate this job. The apply identity's
    # federated credential ONLY trusts the subject `environment:<name>`.
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_APPLY_CLIENT_ID }}
    defaults:
      run:
        working-directory: ${{ inputs.stack_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure login (OIDC, privileged identity)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_APPLY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Download reviewed plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ inputs.state_key }}
          path: ${{ inputs.stack_path }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ inputs.state_container }}" \
            -backend-config="key=${{ inputs.state_key }}" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform apply (exactly the reviewed plan)
        run: terraform apply -input=false tfplan
