# -----------------------------------------------------------------------------
# PR validation: static analysis + read-only OIDC plans for every stack.
#
# Generated with Claude Opus 5.5 - architectural reference, NOT tested in a
# live environment. Validate in a sandbox repository/tenant first.
#
# Security notes
#   * Trigger is `pull_request` (NOT `pull_request_target`): fork PRs get no
#     OIDC token and no repository variables with write context.
#   * The plan identity is read-only on Azure and on state; even a malicious
#     workflow change inside a PR cannot modify the platform.
# -----------------------------------------------------------------------------
name: terraform-plan

on:
  pull_request:
    branches: [main]
    paths:
      - "code/**"
      - ".github/workflows/**"
      - "pipelines/**"
      - ".tflint.hcl"

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.16.6"
  TFLINT_VERSION: "v0.64.0"

jobs:
  static-analysis:
    name: fmt / validate / tflint (${{ matrix.stack }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        stack:
          - code/day-0-bootstrap-oidc
          - code/day-0-cicd-azure-devops
          - code/day-0-cicd-hcp-terraform
          - code/modules/platform-landing-zone
          - code/modules/workload-vending
          - code/day-1-platform-landing-zone
          - code/day-2-workload-vending-operations
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff "${{ matrix.stack }}"

      - name: terraform validate (no backend, no credentials)
        working-directory: ${{ matrix.stack }}
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids GitHub API rate limits when fetching rulesets
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --chdir="${{ matrix.stack }}" --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact

  stacks-validate:
    name: terraform stacks validate (code/hcp-terraform-stacks/alz)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Stacks CLI plugin is downloaded on first use; this job is advisory
    # until the lock file has been generated and committed (see the Stack README).
    continue-on-error: true
    defaults:
      run:
        working-directory: code/hcp-terraform-stacks/alz
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform stacks fmt / init / validate
        run: |
          terraform stacks fmt -check
          terraform stacks init
          terraform stacks validate

  plan-platform:
    name: plan day-1 platform landing zone
    needs: static-analysis
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/_reusable-terraform-stack.yml
    with:
      stack_path: code/day-1-platform-landing-zone
      state_container: tfstate-platform
      state_key: day-1-platform-landing-zone.tfstate
      post_pr_comment: true

  plan-workloads:
    name: plan day-2 workload vending & operations
    needs: static-analysis
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    uses: ./.github/workflows/_reusable-terraform-stack.yml
    with:
      stack_path: code/day-2-workload-vending-operations
      state_container: tfstate-workloads
      state_key: day-2-workload-vending-operations.tfstate
      post_pr_comment: true
